<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食光軌跡 - 玉井篇</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="minigame-view" id="minigameView">
            <div class="game-hud">
                <div class="score-board" id="scoreText">已接芒果: 0 / 5</div>
                <div class="hearts-container" id="heartsContainer">
                    <img src="水果關卡/生命數.png" class="heart-icon" alt="heart">
                    <img src="水果關卡/生命數.png" class="heart-icon" alt="heart">
                    <img src="水果關卡/生命數.png" class="heart-icon" alt="heart">
                </div>
            </div>
            
            <div class="player-cat" id="playerCat">
                <img src="水果關卡/貓咪下.png" class="cat-body" alt="貓咪">
                <div class="collected-fruits" id="collectedFruits"></div>
                <img src="水果關卡/貓咪上.png" class="cat-basket-top" alt="籃子">
            </div>
        </div>

        <div class="projection-modal" id="historyBookModal">
            <div class="book-controls">
                <button class="nav-btn" id="prevPageBtn" onclick="changeBookPage(-1)" style="display: none;">◀ 上一頁</button>
                <span class="page-indicator" id="pageIndicator">1 / 3</span>
                <button class="nav-btn" id="nextPageBtn" onclick="changeBookPage(1)">下一頁 ▶</button>
                <button class="action-btn" id="startStoryBtn" onclick="startStoryFromBook()" style="display: none;">📖 進入故事劇情 ▶</button>
            </div>

            <div class="projection-card">
                <div class="card-content">
                    <img src="歷史書/歷史書_玉井(去背).png" alt="玉井歷史介紹" class="map-img">
                    
                    <div class="book-page active" id="bookPage1">
                        <div class="text-overlay">
                            <h3>地區歷史介紹：</h3>
                            <p>玉井位於臺南市東南部，擁有適合果樹生長的氣候與地形，芒果是當地最具代表性的農產品之一。</p>
                        </div>
                    </div>

                    <div class="book-page" id="bookPage2">
                        <div class="text-overlay">
                            <h3>辛勤栽培的農民：</h3>
                            <p>當地農民透過多年的用心栽培、採收與品種改良，逐漸發展出具有地方特色之芒果產業，支撐起了玉井的經濟發展！</p>
                            <img src="歷史書/歷史書內頁_農民的好芒果(去背).png" class="page-decor-img farmer-img" alt="農民">
                        </div>
                    </div>

                    <div class="book-page" id="bookPage3">
                        <div class="text-overlay">
                            <h3>豐富的芒果加工品：</h3>
                            <p>隨著知名度提升，玉井也發展許多芒果冰店、手作果醬與美味的芒果乾等加工產品，吸引無數遊客前來品嚐美味！</p>
                            <img src="歷史書/歷史書內頁_芒果加工品(去背).png" class="page-decor-img product-img" alt="加工品">
                        </div>
                    </div>
                </div>
            </div>

            <div class="big-book-base">
                <img src="歷史書/歷史書.png" alt="歷史書底座">
            </div>
        </div>

        <div class="story-modal" id="storyModal" onclick="handleStoryClick()">
            <div class="story-box">
                <div class="story-header" id="storyTitle">第一關：玉井區——芒果的祕密</div>
                <div class="story-body">
                    <img src="劇情/冰店.png" class="story-bg" id="storyBg" alt="背景">
                    <img src="小丸/吉祥物1_睜眼閉口.png" class="story-character maruko" id="storyCharMaruko" alt="小丸" style="display:none;">
                    <img src="劇情/芒果冰店長.png" class="story-character manager" id="storyChar" alt="店長" style="display:none;">
                    
                    <div class="dialogue-box">
                        <div class="speaker-name" id="speakerName">小丸</div>
                        <div class="dialogue-text" id="dialogueText"></div>
                        <div class="story-choices" id="storyChoices" style="display:none;"></div>
                    </div>
                </div>
                <div class="story-footer">
                    <button class="nav-btn" id="nextDialogueBtn" onclick="nextDialogue(event)">按 Enter 繼續 ▶</button>
                    <button class="action-btn" id="startMinigameFromStoryBtn" onclick="showGameInstructionModal(event)" style="display:none;">🎮 沒問題！進入採芒果挑戰</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="gameModal">
            <div class="modal-box">
                <div class="modal-title" id="modalTitle">🚂 解鎖成功！</div>
                <div class="modal-text" id="modalText">準備進入挑戰！</div>
                <button class="action-btn modal-action-btn" id="modalBtn" onclick="closeModal()">確定</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
